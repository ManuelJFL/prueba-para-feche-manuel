<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ópera Prima · Manuel Javier</title>
<style>
html,body{margin:0;height:100%;background:#0b0b0e}
body{display:flex;align-items:center;justify-content:center}
.s{position:relative;height:100%;max-width:100%;aspect-ratio:9/16;background:#000}
video{width:100%;height:100%;object-fit:cover;display:block}
button{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;padding:9px 14px;background:#ffffff33;color:#fff;font:600 13px system-ui,sans-serif;backdrop-filter:blur(6px)}
</style></head><body>
<div class="s"><video id="v" src="FECHE_web.mp4" autoplay muted loop playsinline preload="auto"></video>
<button id="b" type="button">Activar sonido</button></div>
<script>
var v=document.getElementById('v'),b=document.getElementById('b');
b.onclick=function(){v.muted=!v.muted;b.textContent=v.muted?'Activar sonido':'Silenciar';v.play()};
v.onclick=function(){v.paused?v.play():v.pause()};
</script></body></html>
